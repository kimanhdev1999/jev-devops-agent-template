# Slack app for the incident agent. Create it at https://api.slack.com/apps
#   → Create New App → From a manifest → pick your workspace → paste this file.
# request_url = terraform output -raw slack_interactivity_url (stays the same all week).
display_information:
  name: SRE Incident Agent
  description: Diagnoses EKS incidents and asks a human before rolling back.
  background_color: "#1d2733"
features:
  bot_user:
    display_name: sre-incident-agent
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write          # post incident messages
      - chat:write.public   # post to public channels without being invited
      - channels:read       # resolve #channel-name -> channel ID during setup
settings:
  interactivity:
    is_enabled: true
    request_url: https://<FUNCTION-URL-ID>.lambda-url.ap-south-1.on.aws/   # terraform output -raw slack_interactivity_url
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
